table: agg_campaign_daily_by_audience
description: Final daily impressions, clicks and CTR per campaign split by user gender
  and age level (audience breakdown / demographics). Users without a profile are 'unknown'.
grain: one row per campaign per day per gender per age level
freshness: final
traffic: all
joins:
  campaign_id: dim_campaign
